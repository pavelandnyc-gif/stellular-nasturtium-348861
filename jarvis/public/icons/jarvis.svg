<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0f2236"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" stroke-width="14" stroke-dasharray="700 242" transform="rotate(-60 256 256)"/>
    <circle cx="256" cy="256" r="112" stroke-width="5" opacity=".55" stroke-dasharray="40 18"/>
  </g>
  <text x="256" y="300" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="150" fill="#e0f7ff" filter="url(#glow)">J</text>
</svg>
